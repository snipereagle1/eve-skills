# Documentation manifest for the SDE skill.
#
# Single source of truth for every canonical URL and volatile fact the skill
# references. SKILL.md stays evergreen; anything that changes when CCP ships a
# new SDE build lives here.
#
# MAINTENANCE: to re-verify, walk `sources`, refetch each `url`, confirm it still
# says what the entry claims, and update `last_verified`. Update `release` (and
# `build`) from the API's `latest/` redirect when a new release ships. `status: legacy` entries are kept
# only for people porting pre-2025 code.
#
# AUTOMATED REFRESH: `/refresh-sde-manifest` launches the `manifest-refresher`
# subagent (report-only). It crawls `role: discovery` sources for new builds /
# posts, checks `role: anchor` sources against the live value, liveness-checks
# the rest, and prints proposed edits. It never writes this file — you apply what
# it proposes.
#
# SOURCE ROLES (agent hints; a source with no `role:` is a leaf = liveness only):
#   role: anchor    -> live value must match a meta field (release name)
#   role: discovery -> crawl this index/feed for entries not yet listed below
#   role: skip      -> do not fetch (templated URL / not machine-checkable)

meta:
  api_base_url: https://sde.evetech.net/tranquility/   # REST API (Early Access); the default
  sde_base_url: https://developers.eveonline.com/static-data/   # zip downloads; the fallback
  # The version anchor is the RELEASE name (ADR 0003). Several releases can share
  # one build number, so the build is kept only as a label (skills/sde-vs-esi
  # mirrors it). The current release is the 302 target of api_base_url + latest/.
  release: 20261116T124006Z                         # API release at last_verified
  build: 3698585                                    # that release's buildNumber
  build_release_date: "2026-11-16T12:40:06Z"
  zip_release_date: "2026-11-13T11:06:47Z"          # the zip lags the API by one republish of build 3698585
  schema_build: 3693310                             # newest afterBuildNumber in schema-changelog
  schema_release_date: "2026-11-13"
  format_default: api-jsonl                         # API JSONL per table; zip JSONL is the fallback
  table_count: 104                                  # tables in the release index at `release`
  last_verified: "2026-11-16"

# Volatile format/protocol facts the discipline leans on. Re-verify against the
# API release index + a fresh zip download.
protocol:
  api:
    release_pointer: latest/                        # 302 -> /tranquility/<release>/, max-age=300
    release_index: '{release, buildNumber, releaseDate, tables}'
    table_entry: [version, jsonl.url, jsonl.recordSchemaUrl, record.urlTemplate, flatbuffers.binaryUrl, flatbuffers.schemaUrl, flatbuffers.binarySchemaUrl]
    record_url: <table>/<key>.json                  # 404 + max-age=60 when missing
    table_url: <table>.jsonl                        # 302 -> /blobs/<version>.jsonl
    key_field: x-sde-key                            # in each table's record schema; replaces _key
    gzip_always: true                               # blobs are content-encoding gzip even for identity
    retention: current and previous release only
    cache: {root_latest_and_release_list: max-age=300, release_index: max-age=86400, table_redirect: max-age=86400, blobs: "max-age=31536000, immutable", not_found: max-age=60}
    cors: access-control-allow-origin * only when the request sends Origin
    sync_rule: >-
      Follow latest/ to the release name. If it is unchanged, stop. Otherwise read
      the release index and download only the tables whose `version` changed.
      `version` also changes on schema-only changes; `_changes.jsonl` does not
      list those.
  formats:
    api_jsonl: {streamable: true, note: "one table per file, named key field, named nested fields; default"}
    flatbuffers: {files: [.fb, .fbs, .bfbs], decode: "flatc --json --strict-json --raw-binary --defaults-json", note: "root vector sorted by its key field"}
    zip_jsonl: {suffix: -jsonl.zip, streamable: true, note: "fallback; _key and _key/_value encoding"}
    zip_yaml:  {suffix: -yaml.zip, native_int_keys: true, note: "whole-file load; heavy on mapMoons/types"}
  encodings:
    api_key: x-sde-key                              # named key field, first in each record
    zip_integer_keys: _key                          # zip only: every record's id
    zip_nested_integer_map: [_key, _value]          # zip only; the API uses named fields
    localized_name: {shape: '{"en":..,"de":..}', fallback: en,
                     not_localized: [dogmaAttributes, dogmaEffects],   # plain-string names
                     absent: [npcStations]}                            # no name field
  zip_caching:
    headers: [ETag, Last-Modified]                  # all resources support both
    build_pointer_cache: max-age=300                # latest.jsonl is cached 5 min
  skill_prereq_attributes:                          # dogma attrs, not a field (see traps)
    required_skill: [182, 183, 184]
    required_level: [277, 278, 1285]
    skill_rank: 275
    sp_formula: "R * 250 * sqrt(32)^(L-1)"          # SP for level L at rank R

sources:
  - id: api-release-pointer
    url: https://sde.evetech.net/tranquility/latest/
    purpose: REST API (Early Access) current release — 302s to /tranquility/<release>/. The version anchor.
    kind: pointer
    role: anchor                                    # release name -> meta.release; buildNumber -> meta.build
    status: early-access
    last_verified: "2026-11-16"
  - id: api-releases
    url: https://sde.evetech.net/tranquility/
    purpose: REST API release list, newest first (current and previous only).
    kind: index
    status: early-access
    last_verified: "2026-11-16"
  - id: sde-docs
    url: https://developers.eveonline.com/docs/services/static-data/
    purpose: SDE overview — formats, download shorthands, build/versioning, caching, changes feed.
    kind: docs
    status: canonical
    last_verified: "2026-11-16"
  - id: static-data-portal
    url: https://developers.eveonline.com/static-data
    purpose: SDE landing page (also links community-provided schemas and alternative formats).
    kind: portal
    status: canonical
    last_verified: "2026-11-16"
  - id: build-pointer
    url: https://developers.eveonline.com/static-data/tranquility/latest.jsonl
    purpose: Zip build pointer — record {"_key":"sde","buildNumber":N,"releaseDate":...}. Trails the API release.
    kind: pointer
    status: canonical
    last_verified: "2026-11-16"
  - id: sde-latest-jsonl
    url: https://developers.eveonline.com/static-data/eve-online-static-data-latest-jsonl.zip
    purpose: Latest SDE, JSON Lines (default format). 302-redirects to the immutable build-numbered zip.
    kind: download
    status: canonical
    last_verified: "2026-11-16"
  - id: sde-latest-yaml
    url: https://developers.eveonline.com/static-data/eve-online-static-data-latest-yaml.zip
    purpose: Latest SDE, YAML (native int keys; whole-file load, heavy on large datasets).
    kind: download
    status: canonical
    last_verified: "2026-11-16"
  - id: sde-build-numbered
    url: https://developers.eveonline.com/static-data/tranquility/eve-online-static-data-<build>-jsonl.zip
    purpose: Immutable build-numbered download (redirect target of the shorthand). URL shape, not a fetchable link — substitute meta.build.
    kind: download
    role: skip                                      # templated URL; liveness is covered by sde-latest-jsonl's redirect
    status: canonical
    last_verified: "2026-08-05"
  - id: schema-changelog
    url: https://developers.eveonline.com/static-data/tranquility/schema-changelog.yaml
    purpose: Official per-build schema changelog. Source of truth for field-level changes (the skill never duplicates it).
    kind: schema
    role: discovery                                 # new build entries appear here; also the source for meta.schema_build
    status: canonical
    last_verified: "2026-11-16"
  - id: changes-feed
    url: https://developers.eveonline.com/static-data/tranquility/changes/3698585.jsonl
    purpose: Per-build data changes feed (`changes/<build>.jsonl`), for diffing between builds.
    kind: pointer
    status: canonical
    last_verified: "2026-11-16"
  # --- Discovery: dev-blog index. Scan for new static-data posts; the post below is a leaf. ---
  - id: blog-index
    url: https://developers.eveonline.com/blog
    purpose: Dev-blog index (date-sorted). Discovery root — scan for new static-data/SDE-relevant posts not yet listed here.
    kind: index
    role: discovery
    status: canonical
    last_verified: "2026-11-16"
  - id: blog-sde-rework
    url: https://developers.eveonline.com/blog/reworking-the-sde-a-fresh-start-for-static-data
    purpose: Dev blog on the 2025 SDE rework — the migration reference for porting old code (folders->map*, nameID->name, splits).
    kind: dev-blog
    status: reference
    last_verified: "2026-11-16"
  - id: blog-military-campaigns-esi
    url: https://developers.eveonline.com/blog/military-campaigns-on-esi-joining-the-war-effort
    purpose: Dev blog on Military Campaigns on ESI; mentions the static data export (militaryCampaigns dataset fields).
    kind: dev-blog
    status: reference
    last_verified: "2026-11-16"
  - id: blog-equinox-esi
    url: https://developers.eveonline.com/blog/equinox-on-esi-structures-sovereignty-and-access-lists
    purpose: Dev blog on Equinox on ESI (structures, sovereignty); mentions the static data export.
    kind: dev-blog
    status: reference
    last_verified: "2026-11-16"
  - id: sde-mcp
    url: https://github.com/snipereagle1/eve-online-sde-mcp
    purpose: Optional dev-time MCP server that indexes the SDE and answers by ID/name. Not a runtime dependency.
    kind: tool
    status: optional
    last_verified: "2026-11-16"
  # --- Legacy: the pre-2025 SDE. Kept only for upgraders; superseded by the above. ---
  - id: sde-legacy-s3
    url: https://eve-static-data-export.s3-eu-west-1.amazonaws.com/tranquility/sde.zip
    purpose: Old S3 SDE export (bsd/ + fsd/ + universe/ folders, per-file YAMLs, nameID fields). Removed by the rework — do not target.
    kind: download
    status: legacy
    last_verified: "2026-11-16"
