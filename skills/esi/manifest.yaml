    purpose: New token-bucket rate limit (429) and legacy 420 error limit.
    kind: portal
    status: canonical
    last_verified: "2026-08-05"
  - id: pagination-x-pages
    url: https://developers.eveonline.com/docs/services/esi/pagination/x-pages/
    purpose: X-Pages pagination scheme.
    kind: portal
    status: canonical
    last_verified: "2026-08-05"
  - id: pagination-cursor
    url: https://developers.eveonline.com/docs/services/esi/pagination/cursor-based/
    purpose: Cursor pagination (limit / before / after).
    kind: portal
    status: canonical
    last_verified: "2026-08-05"
  - id: sso-docs
