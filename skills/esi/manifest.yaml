# Documentation manifest for the ESI skill.
#
# Single source of truth for every canonical URL, header, and volatile fact the
# skill references. The SKILL.md body stays evergreen; anything that can change
# when CCP ships an ESI update lives here.
#
# MAINTENANCE: to re-verify the skill, walk `sources`, refetch each `url`, and
# update `last_verified` (and `verified_compat_date` to the latest compat date).
# `status: legacy`/`sunset` entries are kept only for upgraders.
#
# AUTOMATED REFRESH: `/refresh-esi-manifest` launches the `manifest-refresher`
# subagent (report-only). It reads the `role: anchor` source for the latest
# compat date, crawls `role: discovery` sources for new protocol/spec changes,
# liveness-checks the rest, and prints proposed edits. It never writes this file
# — you apply what it proposes.
#
# SOURCE ROLES (agent hints; a source with no `role:` is a leaf = liveness only):
#   role: anchor    -> live value must match a meta field (latest compat date)
#   role: discovery -> crawl this index/feed for new entries; honor meta.discovery_scope
#   role: skip      -> do not fetch (auth-gated / not machine-checkable)
# The authoritative protocol/spec change feed is GET /meta/changelog (esi-changelog);
# the blog index is secondary/narrative. The latest valid compat date comes from
# GET /meta/compatibility-dates (esi-compatibility-dates).

meta:
  esi_base_url: https://esi.evetech.net
  # ESI versions the whole application against a date (not per-route /v1 numbers).
  compat_date_header: X-Compatibility-Date          # or `compatibility_date` query param
  # Latest compat date the skill is verified against. ESI accepts any date in
  # GET /meta/compatibility-dates (2020-01-01 base .. latest); track the LATEST
  # (element [0]), not the base. The openapi.json enum only shows the base — ignore it.
  verified_compat_date: "2026-08-04"                # latest per /meta/compatibility-dates
  last_verified: "2026-08-05"
  # Discovery filter for the refresh agent — what this manifest tracks:
  discovery_scope: >-
    Protocol/spec mechanics only — compat-date model, spec format, caching,
    rate-limits, and route lifecycle (deprecations/removals). NOT individual
    endpoint or feature announcements (those live in the OpenAPI spec).

# Volatile protocol facts the discipline leans on. Header names are semi-stable;
# re-verify against the OpenAPI spec + best-practices docs below.
protocol:
  caching_headers: [Expires, ETag, Last-Modified]
  conditional_request_header: If-None-Match         # -> 304 Not Modified
  error_limit:
    legacy:                                         # per-route: this OR token_bucket
      status: 420
      window_seconds: 60
      max_errors: 100
      headers: [X-ESI-Error-Limit-Remain, X-ESI-Error-Limit-Reset]
    token_bucket:                                   # newer per-group system
      status: 429
      retry_header: Retry-After
      info_headers: [X-Ratelimit-Group, X-Ratelimit-Limit, X-Ratelimit-Remaining, X-Ratelimit-Used]
  pagination:
    x_pages: {page_header: X-Pages, query_param: page, first_page: 1}
    cursor: {query_params: [limit, before, after], tokens: opaque}
  tenant:
    canonical_header: X-Tenant                      # default tranquility
    legacy_query_param: datasource                  # tranquility only; singularity removed
  user_agent:
    headers: [User-Agent, X-User-Agent]             # fallback query param: user_agent
    include: [app-name, app-version, contact-email]
  auth:
    access_token_ttl_seconds: 1200                  # ~20 min; inferred from token response, not printed on portal
    refresh_token: per-character
    scope_format: space-delimited
    jwt_issuer: [login.eveonline.com, https://login.eveonline.com]
    jwt_audience_contains: ["<client_id>", "EVE Online"]

sources:
  - id: openapi-spec
    url: https://esi.evetech.net/meta/openapi.json
    purpose: Canonical machine-readable spec (OpenAPI 3.1). Source of truth for every endpoint's shape.
    kind: spec
    status: canonical
    last_verified: "2026-08-05"
  - id: esi-compatibility-dates
    url: https://esi.evetech.net/meta/compatibility-dates
    purpose: Canonical list of valid compat dates, newest first. Anchor — element [0] is the latest -> meta.verified_compat_date.
    kind: endpoint
    role: anchor
    status: canonical
    last_verified: "2026-08-05"
  - id: esi-changelog
    url: https://esi.evetech.net/meta/changelog
    purpose: Authoritative machine-readable API changelog, keyed by compat date; each route change flagged is_breaking. Primary protocol/spec discovery feed.
    kind: endpoint
    role: discovery
    status: canonical
    last_verified: "2026-08-05"
  - id: openapi-spec-30
    url: https://esi.evetech.net/meta/openapi-3.0.json
    purpose: Same spec, OpenAPI 3.0 variant for tooling that lacks 3.1 support.
    kind: spec
    status: canonical
    last_verified: "2026-08-05"
  - id: swagger-spec-legacy
    url: https://esi.evetech.net/latest/swagger.json
    purpose: Legacy Swagger 2.0 spec (route-versioned). Upgraders only. Removal CONFIRMED — /latest/swagger.json and /_latest/swagger.json start 404ing 2026-08-11 (see blog-goodbye-swagger).
    kind: spec
    status: sunset
    removal_date: "2026-08-11"
    last_verified: "2026-08-05"
  - id: api-explorer
    url: https://developers.eveonline.com/api-explorer
    purpose: Interactive endpoint explorer (replaces the old esi.evetech.net/ui/ Swagger UI).
    kind: portal
    status: canonical
    last_verified: "2026-08-05"
  - id: esi-overview
    url: https://developers.eveonline.com/docs/services/esi/overview/
    purpose: ESI overview — compatibility-date model and base concepts.
    kind: portal
    status: canonical
    last_verified: "2026-08-05"
  - id: best-practices
    url: https://developers.eveonline.com/docs/services/esi/best-practices/
    purpose: Error-limit headers, caching, and User-Agent etiquette.
    kind: portal
    status: canonical
    last_verified: "2026-08-05"
  - id: rate-limiting
